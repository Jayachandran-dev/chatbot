<!DOCTYPE html>
<html>
<head>
  <title>Zenbot Widget Dev</title>
</head>
<body>
  <h1>Demo host page</h1>
  <p>This page demonstrates the widget. In production, embed via:</p>
  <pre>&lt;script src="http://localhost:8000/zenbot.js?site=YOUR_SITE_ID"&gt;&lt;/script&gt;</pre>

    window.ZENBOT_CONFIG = {

  <script type="module" src="/src/main.js"></script>
</body>
