services:
  backend:
    build: ./backend
    expose:
      - "8000"
    volumes:
      - ./backend/data:/app/data
      - ./backend/static:/app/static
    environment:
      - PYTHONUNBUFFERED=1
      - SECRET_KEY=${SECRET_KEY}
      - ADMIN_USER=${ADMIN_USER:-admin}
      - ADMIN_PASSWORD=${ADMIN_PASSWORD}
      - LLM_ENABLED=${LLM_ENABLED:-true}
      - CORS_ORIGINS=${CORS_ORIGINS:-*}
    restart: unless-stopped

  dashboard:
    build: ./dashboard
    expose:
      - "80"
    depends_on:
      - backend
    restart: unless-stopped

  caddy:
    image: caddy:2
    ports:
      - "80:80"
      - "443:443"
    depends_on:
      - backend
      - dashboard
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    restart: unless-stopped

volumes:
  caddy_data:
  caddy_config:
